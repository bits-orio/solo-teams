# Inactive-team reaper: the /mts-reaper command, the Cleanup panel, and the
# messages both produce. Player-facing wording deliberately never states how
# activity is measured -- publishing the rule invites playing to it.

[mts-reaper]
help=Просмотр или запуск проверки неактивных команд (только для админов). Использование: /mts-reaper [report|scan|dump|arm|disarm|cancel|marker|reset|set <key> <value>]
admin-only=Инструменты для неактивных команд доступны только админам.
usage=Использование: /mts-reaper [report|scan|dump|arm|disarm|cancel|marker|reset|set <key> <value>]
blocked-no-science=Проверка неактивных команд отключена: научные пакеты не найдены, поэтому нет маркера прогресса.
blocked-missing-item=Проверка неактивных команд отключена: предмет-маркер «__1__» отсутствует в этом модпаке.
blocked-unproducible=Проверка неактивных команд отключена: в этом модпаке ничто не производит предмет-маркер «__1__», поэтому у всех команд был бы ноль. Задайте маркер в панели очистки.
blocked-shifted=Проверка неактивных команд приостановлена: маркер уровня 1 был «__1__», но теперь модпак определяет «__2__». Подтвердите маркер в панели очистки.
mode-armed=включено
mode-shadow=теневой режим (только запись)
report-markers=Маркеры: уровень 1 = __1__, уровень 2 = __2__ __3__
report-mode=Режим: __1__. Окно: __2__ дн., проверка каждые __3__ ч.
report-counts=Циклов выполнено: __1__. Отмечено сейчас: __2__. Свободных слотов: __3__.
report-evidence=Вернулись после отметки: __1__. Совпало с вашими роспусками: __2__. Не совпало: __3__. Распущено автоматически: __4__.
report-next=Следующая проверка через __1__.
report-returns-header=Недавние возвращения в отмеченную команду:
report-return-line=  слот __1__ - __2__ вернулся через __3__ дн. после отметки
scan-done=Проверено команд: __1__. Отмечено: __2__. В очереди на роспуск: __3__.
dump-done=Записано строк: __1__ в script-output/__2__.
armed=Автоматический роспуск ВКЛЮЧЁН. Отмеченные команды будут распущены в следующем цикле.
disarmed=Автоматический роспуск выключен. Проверки продолжают идти и записываться, ничего не удаляется.
reset-done=Записанная история и текущие вердикты очищены.
cancel-done=Роспуск отменён, осталось команд: __1__.
cancel-none=Роспуск не выполняется.
auto-queued=[color=red][img=utility/warning_icon] Автоматический роспуск __1__ команд начнётся через __2__ сек. Остановите через диалог или командой /mts-reaper cancel.[/color]
set-usage=Использование: /mts-reaper set <offline_days|cycle_hours|slot_pressure_min> <число>
set-done=__1__ установлено в __2__.
marker-usage=Использование: /mts-reaper marker <tier1|tier2> <название-предмета|auto>
marker-rejected=Маркер «__1__» отклонён: это должен быть предмет, который можно произвести в этом модпаке.
marker-set=__1__ установлено в __2__.
cycle-summary=Проверка неактивных команд: отмечено команд __1__, свободно слотов __2__. Откройте «Очистка команд».
slot-pressure=Осталось всего __1__ слот(ов), при этом __2__ отмечено как неактивные. Откройте «Очистка команд».
bulk-done=[color=red]Распущено команд: __1__. Пропущено: __2__.[/color]
bulk-skipped=  пропущено __1__ (__2__)

