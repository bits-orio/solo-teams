# Inactive-team reaper: the /mts-reaper command, the Cleanup panel, and the
# messages both produce. Player-facing wording deliberately never states how
# activity is measured -- publishing the rule invites playing to it.

[mts-reaper]
help=Inspect or run the inactive-team check (admin only). Usage: /mts-reaper [report|scan|dump|arm|disarm|cancel|marker|reset|set <key> <value>]
admin-only=Only admins can use the inactive-team tools.
usage=Usage: /mts-reaper [report|scan|dump|arm|disarm|cancel|marker|reset|set <key> <value>]
blocked-no-science=Inactive-team checks are off: no science packs were found, so there is no progress marker to measure.
blocked-missing-item=Inactive-team checks are off: the marker item "__1__" does not exist in this modpack.
blocked-unproducible=Inactive-team checks are off: nothing in this modpack can produce the marker item "__1__", so every team would read zero. Set a marker in the Cleanup panel.
blocked-shifted=Inactive-team checks are paused: the tier-1 marker was "__1__" but this modpack now resolves it to "__2__". Confirm a marker in the Cleanup panel to continue.
mode-armed=armed
mode-shadow=shadow (records only)
report-markers=Markers: tier 1 = __1__, tier 2 = __2__ __3__
report-mode=Mode: __1__. Window: __2__ day(s), checked every __3__ hour(s).
report-counts=Cycles run: __1__. Currently flagged: __2__. Free slots: __3__.
report-evidence=Returned after being flagged: __1__. Agreed with your disbands: __2__. Disagreed: __3__. Disbanded automatically: __4__.
report-next=Next check in __1__.
report-returns-header=Recent returns to a flagged team:
report-return-line=  slot __1__ - __2__ came back after __3__ day(s) flagged
scan-done=Checked __1__ teams. Flagged: __2__. Queued for disband: __3__.
dump-done=Wrote __1__ rows to script-output/__2__.
armed=Automatic disband is now ARMED. Flagged teams will be disbanded on the next cycle.
disarmed=Automatic disband is off. Checks still run and record, nothing is destroyed.
reset-done=Cleared the recorded history and standing verdicts.
cancel-done=Cancelled the disband sweep with __1__ team(s) still pending.
cancel-none=No disband sweep is running.
set-usage=Usage: /mts-reaper set <offline_days|cycle_hours|slot_pressure_min> <number>
set-done=Set __1__ to __2__.
marker-usage=Usage: /mts-reaper marker <tier1|tier2> <item-name|auto>
marker-rejected=Marker "__1__" was rejected: it must be an item something in this modpack can produce.
marker-set=Set __1__ to __2__.
cycle-summary=Inactive-team check: __1__ team(s) flagged, __2__ slot(s) free. Open Cleanup to review.
slot-pressure=Only __1__ team slot(s) left, and __2__ flagged as inactive. Open Cleanup to free some up.
bulk-done=Disbanded __1__ team(s). Skipped __2__.
bulk-skipped=  skipped __1__ (__2__)

[mts-cleanup]
title=Team Cleanup
help=Inspect or run the inactive-team check (admin only). Usage: /mts-reaper [report|scan|dump|arm|disarm|cancel|marker|reset|set <key> <value>]
open-button=Team Cleanup
open-tip=Review inactive teams and free up team slots.
summary-mode=Automatic disband: __1__
summary-slots=__1__ slot(s) free, __2__ team(s) occupied.
summary-markers=Progress markers: __1__ (tier 1), __2__ (tier 2)
arm-label=Disband flagged teams automatically
arm-tip=When on, teams the check flags are disbanded on the next cycle without asking. Leave off to review every team here first.
offline-days-label=Offline for at least (days):
markers-label=Progress markers:
markers-tip=The items used to tell a team that got going from one that never did. Resolved automatically from this modpack's science packs; set one to override it.
select-suggested=Select suggested
clear-selection=Clear selection
refresh=Refresh
refresh-tip=Re-measure every team. The table is measured when you open it, so numbers can be a few clicks old.
ping-tip=Spectate this team. Charts the area around their spawn first so the view is not empty.
ping-no-surface=This team has no surface to look at.
col-marker-tip=Sort by __1__
summary-next-armed=Next automatic disband check in __1__.
summary-next-shadow=Next check in __1__ (records only, nothing is disbanded).
disband-selected=Disband selected (__1__)
tip-busy=A disband sweep is already running (__1__ left).
tip-locked=Someone on this team is online, so it cannot be selected.
busy=A disband sweep is already running.
started=Disbanding __1__ team(s). This runs over the next few seconds.
confirm-title=Disband __1__ team(s)?
confirm-message=These __1__ teams will be disbanded and their slots freed. This cannot be undone.\n\n__2__
confirm-more=  ... and __1__ more
confirm-ok=Disband them
confirm-line=  slot __1__ - __2__ (__3__)
verdict-reap=inactive
verdict-keep=active
verdict-skip=-
col-pick=Pick
col-verdict=Status
col-slot=Slot
col-team=Team
col-leader=Player
col-members=Size
col-offline=Offline
col-offline-tip=Green when recently online, yellow right at the disband window, red at four times it.
col-playtime=Played
col-tier1=Tier 1
col-tier2=Tier 2
col-entities=Built
offline-online=online
offline-never=never seen
