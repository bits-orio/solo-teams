report-counts=Durchläufe: __1__. Aktuell markiert: __2__. Freie Slots: __3__.
report-evidence=Nach Markierung zurückgekehrt: __1__. Mit deinen Auflösungen übereinstimmend: __2__. Abweichend: __3__. Automatisch aufgelöst: __4__.
report-returns-header=Kürzliche Rückkehr in ein markiertes Team:
report-return-line=  Slot __1__ - __2__ kam nach __3__ Tag(en) Markierung zurück
scan-done=__1__ Teams geprüft. Markiert: __2__. Zur Auflösung eingereiht: __3__.
dump-done=__1__ Zeilen nach script-output/__2__ geschrieben.
armed=Automatische Auflösung ist jetzt SCHARF. Markierte Teams werden im nächsten Durchlauf aufgelöst.
disarmed=Automatische Auflösung ist aus. Prüfungen laufen weiter und zeichnen auf, nichts wird zerstört.
reset-done=Aufgezeichneter Verlauf und laufende Urteile gelöscht.
