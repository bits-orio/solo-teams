# Inactive-team reaper: the /mts-reaper command, the Cleanup panel, and the
# messages both produce. Player-facing wording deliberately never states how
# activity is measured -- publishing the rule invites playing to it.

[mts-reaper]
help=Prüfung auf inaktive Teams anzeigen oder ausführen (nur Admins). Verwendung: /mts-reaper [report|scan|dump|arm|disarm|cancel|marker|reset|set <key> <value>]
admin-only=Nur Admins können die Werkzeuge für inaktive Teams verwenden.
usage=Verwendung: /mts-reaper [report|scan|dump|arm|disarm|cancel|marker|reset|set <key> <value>]
blocked-no-science=Prüfung auf inaktive Teams ist aus: Es wurden keine Wissenschaftspakete gefunden, also gibt es keinen Fortschrittsmarker.
blocked-missing-item=Prüfung auf inaktive Teams ist aus: Das Marker-Item "__1__" existiert in diesem Modpack nicht.
blocked-unproducible=Prüfung auf inaktive Teams ist aus: In diesem Modpack kann nichts das Marker-Item "__1__" herstellen, also läge jedes Team bei null. Setze im Bereinigungsfenster einen Marker.
blocked-shifted=Prüfung auf inaktive Teams pausiert: Der Stufe-1-Marker war "__1__", dieses Modpack löst ihn jetzt aber zu "__2__" auf. Bestätige im Bereinigungsfenster einen Marker.
mode-armed=scharf
mode-shadow=Schattenmodus (zeichnet nur auf)
report-markers=Marker: Stufe 1 = __1__, Stufe 2 = __2__ __3__
