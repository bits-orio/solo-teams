marker-usage=Verwendung: /mts-reaper marker <tier1|tier2> <Item-Name|auto>
marker-rejected=Marker "__1__" abgelehnt: Es muss ein Item sein, das in diesem Modpack herstellbar ist.
marker-set=__1__ auf __2__ gesetzt.
cycle-summary=Prüfung auf inaktive Teams: __1__ Team(s) markiert, __2__ Slot(s) frei. Öffne die Team-Bereinigung.
slot-pressure=Nur noch __1__ Team-Slot(s) frei, und __2__ als inaktiv markiert. Öffne die Team-Bereinigung.
bulk-done=__1__ Team(s) aufgelöst. __2__ übersprungen.
bulk-skipped=  übersprungen __1__ (__2__)

